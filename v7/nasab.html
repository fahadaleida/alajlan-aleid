<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شجرة النسب</title>
<link rel="icon" type="image/png" href="bg/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Lalezar&family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* صفحة شجرة النسب: تُطبع A3 عمودي، وعلى الشاشة تتسع للنافذة وتقبل التكبير */
:root{--ink:#2b1d10;--gold:#c9970f;--gold2:#f3d27a;--stage:#17110b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:#f4ead6;font-family:Tajawal,system-ui,sans-serif}
.bar{position:fixed;top:0;inset-inline:0;z-index:10;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;
  background:linear-gradient(#17110bf2,#17110bcc);border-bottom:1px solid #f3d27a40;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar a,.bar button{font:700 15px Tajawal,sans-serif;color:#fff4dc;background:#ffffff12;border:1px solid #f3d27a66;border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;line-height:1}
.bar button:hover,.bar a:hover{background:#f3d27a2a}
.bar .pdf{background:linear-gradient(#fff0a8,#e2b545 45%,#b8861c);color:#2b1a03;border-color:#7a5208;font-weight:800;font-size:16px;padding:10px 20px;box-shadow:0 4px 16px #e2b54555}
.bar .pdf:hover{filter:brightness(1.06);background:linear-gradient(#fff0a8,#e2b545 45%,#b8861c)}
.bar .zoom{display:flex;gap:4px}
.bar #uncles{font-weight:500;font-size:13px;opacity:.85}.bar #uncles[aria-pressed=true]{background:#f3d27a33;opacity:1}
.bar .zoom button{min-width:40px;padding:8px 10px}
.stage{position:fixed;inset:58px 0 0 0;overflow:auto;-webkit-overflow-scrolling:touch}
.stage-in{padding:16px;display:flex;justify-content:center;min-width:min-content}
.sheet{position:relative;flex:none;aspect-ratio:297/420;box-shadow:0 20px 60px #000a,0 0 0 1px #f3d27a33;background:#1b2850}
.sheet svg{display:block;width:100%;height:100%}
.msg{max-width:560px;margin:120px auto;text-align:center;font:500 18px Tajawal;line-height:1.8;color:#f4ead6}
@media (max-width:600px){.bar{padding:8px 8px 10px;gap:8px 6px}.bar a,.bar button{font-size:14px;padding:0 13px;min-height:42px;display:inline-flex;align-items:center;justify-content:center}.bar .pdf{font-size:15px;padding:0 18px;min-height:44px}.bar .zoom button{min-width:44px}.stage{inset:54px 0 0 0}.stage-in{padding:8px;min-height:100%}.sheet{margin:auto}}
@page{size:A3 portrait;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .bar{display:none!important}
  .stage{position:static;overflow:visible;inset:auto}
  .stage-in{padding:0;display:block}
  .sheet{width:297mm!important;height:420mm!important;box-shadow:none;margin:0;page-break-inside:avoid;break-inside:avoid}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>
<div class="bar" id="bar">
  <button class="pdf" id="print" type="button">تحميل PDF / طباعة</button>
  <span class="zoom"><button id="zout" type="button" aria-label="تصغير">−</button><button id="zfit" type="button">ملاءمة</button><button id="zin" type="button" aria-label="تكبير">+</button></span>
  <button id="uncles" type="button" aria-pressed="false">إظهار إخوان الأجداد</button>
  <a id="back" href="index.html"><span class="lg">الرجوع&nbsp;</span>للشجرة</a>
</div>
<div class="stage" id="stage"><div class="stage-in"><div class="sheet" id="sheet"></div></div></div>
<script src="gate.js?v=3"></script>
<script>
// ===================================================================
// القرية: نطلع في سلسلة الآباء، وأول جد موجود في القائمة يحدد القرية
// ===================================================================
const VILLAGE_ROOTS={barra:[11 /* علي أمير البرة */, 12 /* سليمان أمير البرة */], ghubba:[/* TBD by client */]};
const VILLAGES={barra:{name:'البرة',bg:'bg/village-barra.jpg'},ghubba:{name:'الغبة',bg:'bg/village-ghubba.jpg'}};
const EDITION='شجرة عائلة العجلان والعيد — الطبعة الثالثة ١٤٤٧هـ';
const KEY='ajlan-aleid-v7',AJLAN_ID=9,DEFAULT_ID=19;

// نسخة احتياطية من SEED في index.html (الاسم والأب واللقب فقط). الصفحة تحاول أولاً تقرأ SEED من index.html نفسه
const SEED_COPY=[
 [1,'الهذلي','m',null,'نسبة إلى هذيل بن مدركة'],[2,'المطرفي','m',1],[3,'عيد','m',2],[4,'محمد','m',3,'قاضي ثرمداء'],[5,'سليمان','m',4],[6,'فهد','m',5],
 [7,'علي','m',6,'الجد الجامع'],[8,'إبراهيم','m',7],[9,'حمد','m',7,'عجلان'],[10,'سليمان','m',7,'الطويل'],[11,'علي','m',8,'أمير البرة ١٢٨٨هـ'],[12,'سليمان','m',8,'أمير البرة ١٢٣٣هـ'],
 [13,'راجح','m',11],[14,'عبدالله','m',11],[15,'فهد','m',11],[16,'محمد','m',11],[17,'سليمان','m',11],[18,'سعد','m',13],[20,'نورة','f',13],[21,'هيا','f',13],[24,'علي','m',13],
 [25,'راجح','m',24],[26,'سعد','m',24],[19,'فهد','m',26],[27,'علي','m',26],[28,'عبدالرحمن','m',26],[29,'عبدالعزيز','m',26],[30,'محمد','m',26],[31,'ريما','f',26],[32,'مرام','f',26],
 [33,'العنود','f',26],[34,'هنادي','f',26],[35,'سلطان','m',27],[36,'نورة','f',27],[37,'سعد','m',27],[22,'سعد','m',19],[23,'لينا','f',19]
].map(([id,name,gender,father,title])=>title?{id,name,gender,father,title}:{id,name,gender,father});

const QS=new URLSearchParams(location.search);
const ar=n=>Number(n).toLocaleString('ar-SA',{useGrouping:false});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// SEED من index.html: نحوّل حرفية JS البسيطة إلى JSON بدون eval
async function seedFromIndex(){
  try{const t=await(await fetch('index.html',{cache:'no-store'})).text();const m=t.match(/const SEED=(\[[\s\S]*?\n\]);/);if(!m)return null;
    const json=m[1].replace(/\/\/[^\n]*/g,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'([^'\\]*)'/g,(_,s)=>JSON.stringify(s)).replace(/,(\s*[\]}])/g,'$1');
    const a=JSON.parse(json);return Array.isArray(a)&&a.length&&a.every(p=>p&&p.id&&p.name)?a:null;}catch(e){return null;}}
async function loadPeople(){
  const seed=(await seedFromIndex())||SEED_COPY;let people=null;
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){for(const p of seed)if(!o[p.id])o[p.id]={...p};people=o;}}}catch(e){}
  if(!people)people=Object.fromEntries(seed.map(p=>[p.id,{...p}]));
  if(people[26]&&people[26].father===25)people[26].father=24;   // نفس التصحيح في index.html
  try{const r=await fetch('people_all.json',{cache:'no-store'});if(r.ok){const j=await r.json(),list=Array.isArray(j)?j:(j.people||Object.values(j));
    for(const q of list){if(!q||q.id==null||q.id<1000||people[q.id])continue;people[q.id]={...q,_ext:true};}}}catch(e){}
  await GATE.ready;   // الزائر: أسماء فقط، ولا تُحمَّل صورة
  if(!GATE.can()){for(const p of Object.values(people))delete p.photo;return people;}
  try{const m=await GATE.photoIndex();if(m){   // صور الرجال الرسمية، مثل index.html
    for(const p of Object.values(people))if(typeof p.photo==='string'&&/^(photos\/|\.\.\/portal\/api\/)/.test(p.photo)&&!m[p.id])delete p.photo;
    for(const id in m){const p=people[id];if(p&&p.gender==='m')p.photo=GATE.photoUrl(id,m[id]);}}}catch(e){}
  return people;}

// ===================================================================
let P={},KIDX={};
const kidsOf=id=>KIDX[id]||[];
function chain(id){const o=[],seen=new Set();let p=P[id];while(p&&!seen.has(p.id)){seen.add(p.id);o.unshift(p);p=P[p.father];}return o;}
const familyOf=c=>c.some(p=>p.id===AJLAN_ID)?'العجلان':'العيد';
function fullNasab(c){const r=c.slice().reverse();return r.map((p,i)=>i===0?p.name:(r[i-1].gender==='f'?'بنت ':'بن ')+p.name).join(' ');}
function villageOf(c){
  const ov=(QS.get('village')||'').toLowerCase();if(VILLAGES[ov])return{key:ov,sure:true,forced:true};
  for(let i=c.length-1;i>=0;i--){for(const k in VILLAGE_ROOTS)if(VILLAGE_ROOTS[k].includes(c[i].id))return{key:k,sure:true};}
  return{key:'barra',sure:false};}

// ===================================================================
// الرسم: SVG متجه بمقاس A3 (٢٩٧×٤٢٠ ملم = ٢٩٧٠×٤٢٠٠ وحدة)
// ===================================================================
const W=2970,H=4200,CX=W/2;
const svgEls=[];let defs='';
const out=s=>svgEls.push(s);
const f1=n=>Math.round(n*10)/10;
function txt(t,x,y,{size=40,font='Amiri',weight=700,fill='#fff',fit=0,anchor='middle',extra='',cls=''}={}){
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${font}" font-weight="${weight}" font-size="${f1(size)}" fill="${fill}" text-anchor="${anchor}" dominant-baseline="central" direction="rtl"${fit?` data-fit="${f1(fit)}"`:''}${cls?` class="${cls}"`:''} ${extra}>${esc(t)}</text>`;}
// غصن متدرج العرض على منحنى بيزييه
function limb(a,b,c1,c2,w0,w1,fill='url(#gBranch)',op=1){const n=24,L=[],R=[];
  const bz=t=>{const u=1-t;return[u*u*u*a[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*b[0],u*u*u*a[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*b[1]];};
  for(let i=0;i<=n;i++){const t=i/n,p=bz(t),q=bz(Math.min(1,t+.01)),p0=t>=1?bz(.99):p,dx=(t>=1?p[0]-p0[0]:q[0]-p[0]),dy=(t>=1?p[1]-p0[1]:q[1]-p[1]),l=Math.hypot(dx,dy)||1,w=(w0+(w1-w0)*t)/2;
    L.push([p[0]-dy/l*w,p[1]+dx/l*w]);R.push([p[0]+dy/l*w,p[1]-dx/l*w]);}
  const pts=[...L,...R.reverse()].map(p=>f1(p[0])+','+f1(p[1])).join(' ');
  return `<polygon points="${pts}" fill="${fill}" opacity="${op}"/>`;}
function shadow(x,y,r){return `<ellipse cx="${f1(x+r*.06)}" cy="${f1(y+r*.14)}" rx="${f1(r*1.04)}" ry="${f1(r*1.0)}" fill="#000" opacity=".28"/>`;}
// ولد: دائرة خضراء بإطار ذهبي (غامقة لمن له ذرية)
function boy(p,x,y,r,{elder=false,photo=null,cap=''}={}){let s=shadow(x,y,r);
  s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r+Math.max(3,r*.09))}" fill="url(#gGold)"/>`;
  if(photo){const id='ph'+(++clipN);defs+=`<clipPath id="${id}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}"/></clipPath>`;
    s+=`<image href="${esc(photo)}" x="${f1(x-r)}" y="${f1(y-r)}" width="${f1(r*2)}" height="${f1(r*2)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>`;
    s+=nameTag(p.name,x,y+r*1.12,Math.max(22,r*.36),'#1f5a2a');}
  else{s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="url(#${elder?'gElder':'gBoy'})"/>`;
    s+=`<ellipse cx="${f1(x-r*.18)}" cy="${f1(y-r*.42)}" rx="${f1(r*.62)}" ry="${f1(r*.34)}" fill="#fff" opacity=".13"/>`;
    s+=nameIn(p.name,x,y,r);}
  if(cap)s+=txt(cap,x,y+r+Math.max(22,r*.46),{size:Math.max(26,r*.52),font:'Tajawal',weight:800,fill:'#fff4d6',fit:r*3.2,cls:'halo'});
  return s;}
// بنت: وردة وردية باسمها
function girl(p,x,y,r){let s=shadow(x,y,r*.92);
  for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;s+=`<circle cx="${f1(x+Math.cos(a)*r*.5)}" cy="${f1(y+Math.sin(a)*r*.5)}" r="${f1(r*.56)}" fill="url(#gPetal)" stroke="#c23d76" stroke-width="${f1(Math.max(1,r*.03))}" stroke-opacity=".5"/>`;}
  s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r*.6)}" fill="url(#gRose)"/>`;
  s+=nameIn(p.name,x,y,r*.86,'#fff','#8a1f4c');return s;}
function nameIn(t,x,y,r,fill='#fff',stroke='#0b2a12'){const fs=r*(t.length>5?.5:t.length>3?.6:.72);
  return txt(t,x,y+r*.04,{size:fs,font:'Amiri',weight:700,fill,fit:r*1.62,extra:`stroke="${stroke}" stroke-width="${f1(fs*.1)}" paint-order="stroke" stroke-linejoin="round"`});}
function nameTag(t,x,y,fs,col){const w=Math.max(fs*2.2,t.length*fs*.55+fs*.9),h=fs*1.45;
  return `<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h/2)}" fill="${col}" stroke="#e9c46a" stroke-width="2"/>`+txt(t,x,y+fs*.04,{size:fs,fill:'#fff',fit:w-fs*.6});}
let clipN=0;
function star(x,y,r,fill='url(#gGold)'){let d='';for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,rr=i%2?r*.45:r;d+=(i?'L':'M')+f1(x+Math.cos(a)*rr)+','+f1(y+Math.sin(a)*rr);}return `<path d="${d}Z" fill="${fill}" stroke="#5c3a06" stroke-width="2"/>`;}
// لوحة ذهبية على الجذع
function plaque(p,x,y,rx,ry,gen,kind){let s='';const fnd=kind==='root'||kind==='founder';
  s+=`<ellipse cx="${f1(x+6)}" cy="${f1(y+ry*.2)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="#000" opacity=".35"/>`;
  if(fnd){s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx+16)}" ry="${f1(ry+14)}" fill="url(#gBronze)" stroke="#3b2304" stroke-width="4"/>`;
    for(let i=0;i<28;i++){const a=i/28*Math.PI*2;s+=`<circle cx="${f1(x+Math.cos(a)*(rx+8))}" cy="${f1(y+Math.sin(a)*(ry+7))}" r="3.4" fill="#ffe9a0"/>`;}}
  s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="url(#gPlaque)" stroke="#5c3a06" stroke-width="5"/>`;
  s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx-10)}" ry="${f1(ry-9)}" fill="none" stroke="#ffe9a0" stroke-width="2.5"/>`;
  s+=`<ellipse cx="${f1(x-rx*.15)}" cy="${f1(y-ry*.48)}" rx="${f1(rx*.55)}" ry="${f1(ry*.22)}" fill="#fff" opacity=".22"/>`;
  const t=p.title,nfs=t?ry*.7:ry*1.0,coinR=Math.min(ry*.62,36);
  const textW=(rx-coinR-16)*2-28;
  if(t){s+=txt(p.name,x+coinR*.5,y-ry*.3,{size:nfs,fill:'#1b1003',fit:textW});
    s+=txt(t,x+coinR*.5,y+ry*.5,{size:Math.min(ry*.4,32),fill:'#6b2207',fit:textW*.98});}
  else s+=txt(p.name,x+coinR*.5,y+ry*.02,{size:nfs,fill:'#1b1003',fit:textW});
  // رقم الجيل على طرف اللوحة
  const cx=x-rx+coinR+12;
  s+=`<circle cx="${f1(cx)}" cy="${f1(y)}" r="${f1(coinR)}" fill="#3a2416" stroke="#ffe08a" stroke-width="3"/>`+txt(ar(gen),cx,y+coinR*.06,{size:coinR*1.0,font:'Tajawal',weight:800,fill:'#ffe9a0'});
  if(fnd){star(0,0,0);s+=star(x+rx+30,y,24)+star(x-rx-30,y,24);}
  return s;}

// أرقام عشوائية ثابتة لكل شخص (نفس الرسمة كل مرة)
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}
const LEAF_D=r=>`M0,${f1(-r*1.32)} C${f1(r*1.12)},${f1(-r*.72)} ${f1(r*1.08)},${f1(r*.62)} 0,${f1(r*1.02)} C${f1(-r*1.08)},${f1(r*.62)} ${f1(-r*1.12)},${f1(-r*.72)} 0,${f1(-r*1.32)}Z`;
// ورقة زينة صغيرة (بدون اسم)
function leaf(x,y,r,rot,v){const fill=['url(#gLeafA)','url(#gLeafB)','url(#gLeafC)'][v];
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})"><path d="${LEAF_D(r)}" fill="${fill}" stroke="#0f4a1c" stroke-width="1.2" stroke-opacity=".5"/><path d="M0,${f1(r*.9)} Q${f1(r*.08)},0 0,${f1(-r*1.15)}" fill="none" stroke="#e9ffd9" stroke-opacity=".45" stroke-width="1.6"/></g>`;}
function blossom(x,y,r){let s='';for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;s+=`<circle cx="${f1(x+Math.cos(a)*r*.5)}" cy="${f1(y+Math.sin(a)*r*.5)}" r="${f1(r*.5)}" fill="#f6b9d0"/>`;}return s+`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r*.3)}" fill="#f3d27a"/>`;}
function bud(x,y,r){return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="url(#gBud)" stroke="#6f8f2a" stroke-width="1.2" stroke-opacity=".6"/>`;}
// ولد بلا ذرية: ورقة خضراء كبيرة باسمه (كما في الطبعة)
function namedLeaf(p,x,y,r,rot){rot=Math.max(-28,Math.min(28,((rot+540)%360)-180));
  let s=`<g transform="translate(${f1(x+r*.06)},${f1(y+r*.16)}) rotate(${f1(rot)})"><path d="${LEAF_D(r*1.02)}" fill="#000" opacity=".25"/></g>`;
  s+=`<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})"><path d="${LEAF_D(r)}" fill="url(#gBoy)" stroke="#f3d27a" stroke-width="${f1(Math.max(2,r*.06))}"/><path d="M0,${f1(r*.95)} Q${f1(r*.08)},0 0,${f1(-r*1.2)}" fill="none" stroke="#e9ffd9" stroke-opacity=".3" stroke-width="${f1(r*.05)}"/></g>`;
  return s+nameIn(p.name,x,y-r*.08,r*.92);}
let SHOW_UNCLES=false;
// خرطوشة الجد: إطار برونزي بزوايا مقعّرة، اسم كبير، لقب واضح، ورقم الجيل في عملة
function cartouche(p,x,y,w,h,gen,kind,side){const x0=x-w/2,x1=x+w/2,y0=y-h/2,y1=y+h/2,k=h*.26;
  const P=(x0,y0,x1,y1,k)=>`M${f1(x0+k)},${f1(y0)} L${f1(x1-k)},${f1(y0)} A${f1(k)},${f1(k)} 0 0 0 ${f1(x1)},${f1(y0+k)} L${f1(x1)},${f1(y1-k)} A${f1(k)},${f1(k)} 0 0 0 ${f1(x1-k)},${f1(y1)} L${f1(x0+k)},${f1(y1)} A${f1(k)},${f1(k)} 0 0 0 ${f1(x0)},${f1(y1-k)} L${f1(x0)},${f1(y0+k)} A${f1(k)},${f1(k)} 0 0 0 ${f1(x0+k)},${f1(y0)}Z`;
  const big=kind==='root'||kind==='founder',ms=big||kind==='titled',fr=big?16:ms?12:9;let s='';
  s+=`<path d="${P(x0-fr+8,y0-fr+14,x1+fr+8,y1+fr+14,k+fr)}" fill="#000" opacity=".38"/>`;
  s+=`<path d="${P(x0-fr,y0-fr,x1+fr,y1+fr,k+fr)}" fill="url(#${big?'gBronzeDeep':'gBronze'})" stroke="#2b1603" stroke-width="3"/>`;
  if(big){const per=2*(w+h);for(let i=0,m=Math.round(per/34);i<m;i++){const t=i/m*per;let px,py;

// تصغير النص الطويل حتى يدخل مكانه (بعد تحميل الخطوط)
function fitTexts(root){root.querySelectorAll('text[data-fit]').forEach(t=>{const max=+t.dataset.fit;if(!t.dataset.fs)t.dataset.fs=t.getAttribute('font-size');
  t.setAttribute('font-size',t.dataset.fs);let w=0;try{w=t.getComputedTextLength();}catch(e){}if(w>max)t.setAttribute('font-size',f1(t.dataset.fs*max/w));});}

// ===================================================================
// العرض والتكبير
// ===================================================================
const sheet=document.getElementById('sheet'),stage=document.getElementById('stage');let zoom=1;
function layout(){stage.style.top=document.getElementById('bar').offsetHeight+'px';const pad=innerWidth<=600?16:32,aw=stage.clientWidth-pad,ah=stage.clientHeight-pad,fit=Math.min(aw,ah*297/420);
  const base=innerWidth<=600?aw:fit;sheet.style.width=Math.round(base*zoom)+'px';}
function setZoom(z,keep=true){const cx=stage.scrollLeft+stage.clientWidth/2,cy=stage.scrollTop+stage.clientHeight/2,old=sheet.offsetWidth;
  zoom=Math.max(1,Math.min(8,z));layout();const k=sheet.offsetWidth/old;if(keep){stage.scrollLeft=cx*k-stage.clientWidth/2;stage.scrollTop=cy*k-stage.clientHeight/2;}}
document.getElementById('zin').onclick=()=>setZoom(zoom*1.4);
document.getElementById('zout').onclick=()=>setZoom(zoom/1.4);
document.getElementById('zfit').onclick=()=>{zoom=1;layout();stage.scrollTo(0,0);};
document.getElementById('print').onclick=()=>window.print();
let CUR=null;
document.getElementById('uncles').onclick=e=>{SHOW_UNCLES=!SHOW_UNCLES;e.currentTarget.setAttribute('aria-pressed',SHOW_UNCLES);e.currentTarget.textContent=SHOW_UNCLES?'إخفاء إخوان الأجداد':'إظهار إخوان الأجداد';if(CUR!=null){sheet.innerHTML=build(CUR);fitTexts(sheet.querySelector('svg'));placeLogos(sheet.querySelector('svg'));}};
stage.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15));},{passive:false});
addEventListener('resize',layout);
sheet.addEventListener('dblclick',()=>setZoom(zoom>1.2?1:2.4));
addEventListener('beforeprint',()=>{const s=sheet.querySelector('svg');if(s){fitTexts(s);placeLogos(s);}});

(async()=>{
  P=await loadPeople();KIDX={};
  for(const p of Object.values(P)){if(p.father==null)continue;(KIDX[p.father]=KIDX[p.father]||[]).push(p);}
  for(const k in KIDX)KIDX[k].sort((a,b)=>a.id-b.id);
  const id=+(QS.get('id')||DEFAULT_ID);
  document.getElementById('back').href='index.html#'+id;   // الشجرة تفتح بطاقته مباشرة
  if(!P[id]){sheet.outerHTML=`<div class="msg">ما لقينا شخصاً برقم «${esc(QS.get('id'))}».<br>افتح الصفحة من زر «شجرة النسب» في بطاقة الشخص، أو اكتب الرابط بهذا الشكل: <b>nasab.html?id=19</b></div>`;return;}
  if(QS.get('uncles')==='1'){SHOW_UNCLES=true;const b=document.getElementById('uncles');b.setAttribute('aria-pressed','true');b.textContent='إخفاء إخوان الأجداد';}
  CUR=id;layout();sheet.innerHTML=build(id);
  const s=sheet.querySelector('svg');fitTexts(s);
  try{await document.fonts.ready;}catch(e){}
  await Promise.all(['700 40px "Aref Ruqaa"','700 40px Amiri','800 40px Tajawal','500 40px Tajawal'].map(f=>document.fonts.load(f,'عربي').catch(()=>{})));
  fitTexts(s);placeLogos(s);document.body.dataset.ready='1';
})();
</script>
