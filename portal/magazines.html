<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلة الأسرة | أسرة العجلان والعيد</title>
<meta name="description" content="مكتبة مجلة أسرة العجلان والعيد: كل الأعداد للتحميل والقراءة.">
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021310">
<link rel="stylesheet" href="home.css?v=202611021310">
<link rel="stylesheet" href="mag.css?v=202611021310">
</head>
<body class="home mags">
<div id="scene" aria-hidden="true"></div>

<main class="hwrap" style="padding-top:calc(var(--nav) + 30px)">
  <!-- الأعداد على دائرة حول شمس الغروب (يسار)، وتفاصيل العدد المختار (يمين) -->
  <section class="orbit-wrap">
    <div class="oinfo">
      <div class="crumbs"><a href="index.html">الرئيسية</a> ‹ المجلات</div>
      <h1>مكتبة مجلة الأسرة</h1>
      <p class="lead">أعداد مجلة أسرة العجلان والعيد تدور حول شمس الديرة. اضغط على أي عدد لتحميله.</p>
      <div class="sel glass-panel" id="sel">
        <small>العدد الحالي</small>
        <div class="sn"><b id="selN"></b><div><span id="selD"></span><em id="selS"></em></div></div>
        <a class="cta" id="selA" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>تحميل العدد</a>
      </div>
      <a class="more-link" href="news.html?q=مجلة">أخبار المجلة والمشاركات ←</a>
    </div>
    <div class="orbit" id="orbit" aria-label="أعداد المجلة">
      <div class="sun"><span class="core"></span><span class="glow"></span><span class="ring r1"></span><span class="ring r2"></span><img src="img/logo-mark.png" alt=""></div>
      <div class="books" id="books"></div>
    </div>
  </section>
  <div class="breath"></div>
</main>

<script src="common.js?v=202611021310"></script>
<script src="rockets.js?v=202611021310"></script>
<script>
const issueDate = s => {const m = s.match(/^(\S+)\s+\d+,\s*(\d{4})/); return m ? `${m[1]} ${ar(+m[2])}` : s;};
(async () => {
  const site = await loadJSON('data/site.json');
  buildChrome(site);
  withTree(document.querySelector('.orbit-wrap'));
  const M = [...site.magazines].sort((a, b) => b.n - a.n);
  $('#books').innerHTML = M.map((m, i) => `<a class="book" href="${esc(m.u)}" target="_blank" rel="noopener" data-i="${i}" aria-label="تحميل العدد ${m.n}">
    <span class="b3"><span class="cover"><img src="img/logo-mark.png" alt=""><em>مجلة الأسرة</em><strong>${ar(m.n)}</strong><small>العدد</small><time>${esc(issueDate(m.date))}</time></span></span></a>`).join('');
  const B = [...$('#books').children], N = B.length, orbit = $('#orbit');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase = 0, last = performance.now(), paused = false, cur = -1;
  orbit.addEventListener('mouseenter', () => paused = true); orbit.addEventListener('mouseleave', () => paused = false);
  const setSel = i => {if (i === cur) return; cur = i; const m = M[i];
    B.forEach((b, j) => b.classList.toggle('on', j === i));
    const s = $('#sel'); s.classList.remove('flip'); void s.offsetWidth; s.classList.add('flip');
    $('#selN').textContent = ar(m.n); $('#selD').textContent = issueDate(m.date); $('#selS').textContent = m.size; $('#selA').href = m.u;};
  B.forEach((b, i) => b.addEventListener('mouseenter', () => setSel(i)));
  const frame = t => {
    requestAnimationFrame(frame);
    const dt = Math.min(64, t - last); last = t;
    if (!paused && !RM && !document.hidden) phase += dt * 0.000105;   // لفة كاملة كل دقيقة تقريباً (هادئة)
    const w = orbit.clientWidth, R = w * .39, cx = w / 2, cy = orbit.clientHeight / 2;
    let best = 0, bd = 9;
    B.forEach((b, i) => {
      const a = i / N * Math.PI * 2 + phase;           // تدور مع عقارب الساعة
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      // العدد الأقرب إلى جهة التفاصيل (يمين الدائرة) يكبر ويصير هو المختار
      const d = Math.abs(Math.atan2(Math.sin(a), Math.cos(a)));
      if (d < bd) {bd = d; best = i;}
      const k = 1 - Math.min(1, d / 1.2);
      b.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${.82 + .26 * k})`;
      b.style.zIndex = 10 + Math.round(k * 10);
    });
    if (!paused) setSel(best);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
