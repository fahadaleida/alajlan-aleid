<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلة الأسرة | أسرة العجلان والعيد</title>
<meta name="description" content="مكتبة مجلة أسرة العجلان والعيد: كل الأعداد للتحميل والقراءة.">
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021005">
<link rel="stylesheet" href="home.css?v=202611021005">
<link rel="stylesheet" href="mag.css?v=202611021005">
</head>
<body class="home mags">
<div id="scene" aria-hidden="true"></div>

<main class="hwrap" style="padding-top:calc(var(--nav) + 34px)">
  <div class="mhead">
    <div class="crumbs"><a href="index.html">الرئيسية</a> ‹ المجلات</div>
    <h1>مكتبة مجلة الأسرة</h1>
    <p>أعداد مجلة أسرة العجلان والعيد، اضغط على العدد لتحميله</p>
  </div>

  <div class="hgrid mgrid-lib">
    <!-- الكتب تصعد ببطء بلا توقف، وترتيبها ثابت -->
    <section class="lib" id="lib" aria-label="أعداد المجلة">
      <div class="track" id="track"></div>
      <div class="hint">مرّر على العدد ليتوقف</div>
    </section>

    <!-- الشجرة أمام قرص الشمس -->
    <aside class="suntree" aria-label="شجرة العائلة">
      <div class="rays"></div><div class="sun"></div>
      <div class="st" id="st">
        <img src="img/tree-cut.webp" srcset="img/tree-cut-sm.webp 895w, img/tree-cut.webp 1790w" sizes="400px" alt="شجرة عائلة العجلان والعيد" id="treeImg">
        <canvas id="rockets"></canvas>
      </div>
      <div class="horizon"></div>
      <div class="refl" aria-hidden="true"><img src="img/tree-cut-sm.webp" alt=""></div>
    </aside>
  </div>
  <div class="more"><a class="btn ghost" href="news.html?q=مجلة">أخبار المجلة والمشاركات</a></div>
  <div class="breath"></div>
</main>

<script src="common.js?v=202611021005"></script>
<script src="rockets.js?v=202611021005"></script>
<script>
const issueDate = s => {const m = s.match(/^(\S+)\s+\d+,\s*(\d{4})/); return m ? `${m[1]} ${ar(+m[2])}` : s;};
(async () => {
  const site = await loadJSON('data/site.json');
  buildChrome(site);
  const M = [...site.magazines].sort((a, b) => b.n - a.n);
  const book = m => `<a class="book" href="${esc(m.u)}" target="_blank" rel="noopener" aria-label="تحميل العدد ${m.n}">
      <span class="b3"><span class="spine"><b>${ar(m.n)}</b></span><span class="cover">
        <img src="img/logo-mark.png" alt=""><em>مجلة الأسرة</em><strong>${ar(m.n)}</strong><small>العدد</small><time>${esc(issueDate(m.date))}</time><i>أسرة العجلان والعيد</i>
      </span><span class="pages"></span></span></a>`;
  const draw = () => {
    const n = innerWidth < 640 ? 3 : innerWidth < 1024 ? 4 : 5, rows = [];
    for (let i = 0; i < M.length; i += n) rows.push(M.slice(i, i + n));
    const html = rows.map(r => `<div class="row">${r.map(book).join('')}</div>`).join('');
    // نسختين متتاليتين: لما تطلع الأولى فوق تكون الثانية مكانها، فالحركة ما تنقطع
    $('#track').innerHTML = html + html.replace(/<a class="book"/g, '<a class="book" tabindex="-1" aria-hidden="true"');
    $('#track').style.setProperty('--dur', rows.length * 9 + 's');
  };
  draw();
  let w = innerWidth; addEventListener('resize', () => {if (Math.abs(innerWidth - w) > 60) {w = innerWidth; draw();}});
  startRockets();
})();
</script>
</body>
</html>
