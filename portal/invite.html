<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصمم الدعوات</title>
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=El+Messiri:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f4efe6;--surface:#fff;--line:#e6dcc8;--text:#211c33;--muted:#6e6879;--navy:#322781;--navy-d:#1a1448;--gold:#c08537;--gold-l:#e3b66b;--gold-d:#9a6a26;--field:#fbf8f2;--shadow:0 1px 2px rgba(30,23,87,.05),0 8px 24px rgba(30,23,87,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f26;--surface:#1c1838;--line:#332c5c;--text:#f1ecdf;--muted:#a9a2bf;--field:#15122c;--shadow:0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#120f26;--surface:#1c1838;--line:#332c5c;--text:#f1ecdf;--muted:#a9a2bf;--field:#15122c;--shadow:0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:clip}
body{background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#3a2f96,#322781 50%,#1e1757);color:#fff;box-shadow:0 6px 20px rgba(20,16,48,.25);border-bottom:1px solid rgba(227,182,107,.35)}
header.top .in{max-width:1320px;margin:auto;display:flex;align-items:center;gap:12px;padding:9px 16px}
header.top img{height:38px}
header.top h1{font-size:18px;margin:0;font-weight:800;line-height:1.35}
header.top h1 small{display:block;font-size:12px;font-weight:600;color:var(--gold-l)}
header.top a.home{margin-inline-start:auto;color:#fff;text-decoration:none;font-size:14px;font-weight:700;border:1px solid rgba(227,182,107,.45);padding:7px 14px;border-radius:999px}
main{max-width:1320px;margin:auto;padding:22px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
.stage{position:sticky;top:80px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage .cv{width:auto;max-width:100%;max-height:calc(100vh - 170px);border-radius:10px;box-shadow:0 24px 60px rgba(20,16,48,.35),0 0 0 1px rgba(192,133,55,.25);background:#1a1448;display:block}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.gold{background:linear-gradient(135deg,#e3b66b,#c08537 55%,#9a6a26);color:#1a1448;box-shadow:0 8px 20px rgba(192,133,55,.35)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-l),var(--gold-d))}
details.card>summary::after{content:"⌄";margin-inline-start:auto;color:var(--muted);transition:transform .2s}
details.card[open]>summary::after{transform:rotate(180deg)}
.body{padding:0 16px 16px;display:grid;gap:12px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f textarea,label.f select{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f textarea{resize:vertical;min-height:64px;line-height:1.7}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:2px solid var(--gold-l);outline-offset:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(227,182,107,.9)}
.ph{border:1px solid var(--line);background:var(--field);border-radius:14px;padding:12px;display:grid;gap:10px}
.ph .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .th{width:52px;height:64px;border-radius:26px 26px 6px 6px;background:var(--surface) center/cover no-repeat;border:2px solid var(--gold-l);flex:none}
.ph .hd b{font-size:14.5px}
.ph .hd .x{margin-inline-start:auto;display:flex;gap:6px}
.ph .hd label.up,.ph .hd button{font:inherit;font-size:13px;font-weight:700;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.ph input[type=file]{display:none}
.ph input[type=range]{width:100%;accent-color:var(--gold)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#1a1448;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;transition:.3s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.fab{display:none}
.tapnote{display:none}
@media (max-width:980px){
  main{display:block;padding:0 16px 110px}
  .panel{margin-top:14px}
  .stage{position:sticky;top:57px;z-index:15;background:var(--bg);padding:10px 0 8px;margin:0 -16px;gap:6px;box-shadow:0 10px 16px -12px rgba(20,16,48,.35)}
  .stage .cv{max-height:35vh;border-radius:8px;cursor:zoom-in;transition:max-height .25s}
  .stage.big .cv{max-height:78vh;cursor:zoom-out}
  .stage .acts{display:none}
  .tapnote{display:block;font-size:11.5px;color:var(--muted)}
  .fab{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
  .fab .btn{flex:1;justify-content:center}
}
@media (max-width:420px){.row3.dates{grid-template-columns:1fr 1fr}.row3.dates label:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <img src="img/logo-mark.png" alt="">
  <h1>مصمم الدعوات<small>أسرة العجلان والعيد</small></h1>
  <a class="home" href="index.html">الرئيسية</a>
</div></header>

<main>
  <div class="stage" id="stage">
    <canvas class="cv" id="cv" aria-label="معاينة الدعوة"></canvas>
    <div class="tapnote">اضغط على المعاينة لتكبيرها</div>
    <div class="acts"><button class="btn gold" data-act="png">⬇ تحميل الصورة</button><button class="btn ghost" data-act="share">مشاركة</button></div>
  </div>

  <div class="panel" id="panel">
    <details class="card" open><summary>الشكل</summary><div class="body">
      <div><div class="hint" style="margin-bottom:6px">المقاس</div><div class="seg" data-k="size"><button data-v="post">بوست ٤:٥</button><button data-v="square">مربع</button><button data-v="story">ستوري</button></div></div>
      <div><div class="hint" style="margin-bottom:6px">اللون</div><div class="seg" data-k="theme">
        <button data-v="navy"><i style="background:#241c6b"></i>كحلي ملكي</button>
        <button data-v="ivory"><i style="background:#f6eedb"></i>عاجي</button>
        <button data-v="emerald"><i style="background:#0d4f3e"></i>زمردي</button>
        <button data-v="night"><i style="background:#141210"></i>أسود فاخر</button>
        <button data-v="ruby"><i style="background:#5a1128"></i>عنابي</button></div></div>
      <label class="f">عنوان الدعوة<input data-k="badge" placeholder="مثل: دعوة زواج"></label>
      <label class="f">سطر التذكير (اختياري)<input data-k="remind" placeholder="مثل: تذكير · غداً بإذن الله"></label>
    </div></details>

    <details class="card" open><summary>الصور</summary><div class="body" id="photos"></div></details>

    <details class="card" open><summary>نص الدعوة</summary><div class="body">
      <label class="f">قبل الداعين<input data-k="lead"></label>
      <label class="f">الداعي الأول<input data-k="host1"></label>
      <label class="f">الداعي الثاني (اختياري)<input data-k="host2"></label>
      <label class="f">نص الدعوة<textarea data-k="body"></textarea></label>
      <div class="row2"><label class="f">قبل اسم العريس<input data-k="groomPre"></label><label class="f">اسم العريس<input data-k="groom"></label></div>
      <div class="row2"><label class="f">قبل اسم والد العروس<input data-k="bridePre"></label><label class="f">والد العروس<input data-k="bride"></label></div>
    </div></details>

    <details class="card" open><summary>الموعد والمكان</summary><div class="body">
      <div class="row3 dates"><label class="f">اليوم<input data-k="day"></label><label class="f">هجري<input data-k="hijri"></label><label class="f">ميلادي<input data-k="greg"></label></div>
      <div class="row2"><label class="f">الوقت<input data-k="time"></label><label class="f">المكان<input data-k="venue"></label></div>
      <label class="f">رابط الموقع على الخريطة (يطلع باركود)<input data-k="map" dir="ltr" placeholder="https://maps.app.goo.gl/..."></label>
      <label class="f">الختام<input data-k="close"></label>
    </div></details>

    <details class="card"><summary>التذييل</summary><div class="body">
      <label class="f">حسابات الأسرة<input data-k="social" dir="ltr"></label>
      <label class="f">الموقع<input data-k="site" dir="ltr"></label>
      <button class="btn ghost" data-act="reset" style="justify-self:start">↺ رجّع النموذج الأصلي</button>
      <p class="hint">كل اللي تكتبه ينحفظ في جهازك تلقائياً. الصور تنحفظ إذا كانت مساحة الجهاز تسمح.</p>
    </div></details>
  </div>
</main>
<div class="fab"><button class="btn gold" data-act="png">⬇ تحميل الصورة</button><button class="btn ghost" data-act="share">مشاركة</button></div>
<div class="toast" id="toast"></div>

<script>
const DEF={size:'post',theme:'navy',badge:'دعوة زواج',remind:'تذكير · غداً بإذن الله',
  lead:'يتشرف أبناء',host1:'عبدالله بن إبراهيم السعد العجلان',host2:'عبدالله بن عبدالعزيز الشايع',
  body:'بدعوتكم لحضور حفل الزواج وتناول طعام العشاء بمناسبة زواج',
  groomPre:'الأخ',groom:'عبدالعزيز بن عبدالله العجلان',bridePre:'على كريمة',bride:'عبدالله بن عبدالعزيز الشايع',
  day:'الثلاثاء',hijri:'٢٣ / ٥ / ١٤٤٨هـ',greg:'٣ / ١١ / ٢٠٢٦م',time:'مساءً',venue:'قاعة سراج',map:'',
  close:'والدعوة عامة لجميع أفراد الأسرة',social:'@alajlanandaleid',site:'alajlanandaleid.com',
  photos:[{src:'img/invite/p1.jpg',role:'والد العريس',name:'عبدالله بن إبراهيم العجلان',note:'رحمه الله',z:1,x:0,y:0},
          {src:'img/invite/p3.jpg',role:'العريس',name:'عبدالعزيز بن عبدالله العجلان',note:'',z:1,x:0,y:0},
          {src:'img/invite/p2.jpg',role:'والد العروس',name:'عبدالله بن عبدالعزيز الشايع',note:'',z:1,x:0,y:0}]};
const KEY='ajlan-invite-v1';
let S=structuredClone(DEF);
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(structuredClone(DEF),v);}catch(e){}
// ترحيل: النسخة السابقة كانت تحط العريس يسار، الحين العريس في الوسط وأكبر
if(!S.v2){const P=S.photos;if(P&&P.length===3&&P[2]&&P[2].role==='العريس'&&P[1]&&P[1].role!=='العريس'){[P[1],P[2]]=[P[2],P[1]];}S.v2=1;}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){try{localStorage.setItem(KEY,JSON.stringify({...S,photos:S.photos.map(p=>({...p,src:p.src.startsWith('data:')?'':p.src}))}));}catch(e2){}}};

// الألوان: bg0 وسط، bg1 أطراف، goldA فاتح، goldB وسط، goldC غامق
const THEMES={
  navy:   {dark:1,bg0:'#2c2388',bg1:'#0d0a2c',goldA:'#f8e3ad',goldB:'#d5a456',goldC:'#9a6a26',ink:'#ffffff',soft:'rgba(255,255,255,.84)',muted:'rgba(238,222,190,.72)',pat:'227,182,107',patA:.075,tint:'10,8,38',medal:'#18124a',glow:'rgba(240,200,120,.16)'},
  ivory:  {dark:0,bg0:'#fffbf2',bg1:'#eadcbc',goldA:'#cf9a48',goldB:'#a8732c',goldC:'#6e4512',ink:'#1e1757',soft:'rgba(30,23,87,.86)',muted:'rgba(122,82,26,.9)',pat:'168,115,44',patA:.11,tint:'48,34,22',tintA:.55,medal:'#1e1757',glow:'rgba(255,255,255,.75)'},
  emerald:{dark:1,bg0:'#136650',bg1:'#03221a',goldA:'#f5dfa6',goldB:'#d1a257',goldC:'#946728',ink:'#ffffff',soft:'rgba(255,255,255,.85)',muted:'rgba(236,226,196,.74)',pat:'227,190,120',patA:.075,tint:'2,26,20',medal:'#06352a',glow:'rgba(240,210,140,.14)'},
  night:  {dark:1,bg0:'#2b2722',bg1:'#060505',goldA:'#f6dfa6',goldB:'#d0a052',goldC:'#8f6224',ink:'#ffffff',soft:'rgba(255,255,255,.84)',muted:'rgba(232,218,188,.7)',pat:'214,170,96',patA:.07,tint:'0,0,0',medal:'#141210',glow:'rgba(240,200,120,.13)'},
  ruby:   {dark:1,bg0:'#741834',bg1:'#22040e',goldA:'#f8e1aa',goldB:'#d6a457',goldC:'#9a6a26',ink:'#ffffff',soft:'rgba(255,255,255,.85)',muted:'rgba(240,222,196,.74)',pat:'232,186,112',patA:.075,tint:'30,3,12',medal:'#3e0918',glow:'rgba(245,205,130,.14)'}};
// r: نصف قطر الختم، s: ارتفاع قوس المحراب، scMax: أكبر مقياس، ps: مقياس الصور
const SZ={post:{W:1080,H:1350,r:50,s:330,scMax:1,ps:1.08,pkMin:.86},square:{W:1080,H:1080,r:40,s:210,scMax:.9,ps:1,pkMin:.85,split:1},story:{W:1080,H:1920,r:66,s:470,scMax:1.18,ps:1.3,pkMin:.9}};
const SIZES=Object.fromEntries(Object.entries(SZ).map(([k,v])=>[k,[v.W,v.H]]));

const cv=document.getElementById('cv'),g=cv.getContext('2d');
const IMG={},LOGO=new Image();LOGO.src='img/logo.png';LOGO.onload=()=>draw();
function img(src){if(!src)return null;let i=IMG[src];if(!i){i=IMG[src]=new Image();i.onload=()=>draw();i.src=src;}return i.complete&&i.naturalWidth?i:null;}

// ===== أدوات =====
const F={ruqaa:'"Aref Ruqaa",Amiri,serif',mes:'"El Messiri",Cairo,sans-serif',cairo:'Cairo,sans-serif',bism:'"Scheherazade New",Amiri,serif'};
const font=(w,s,f)=>`${w} ${Math.round(s)}px ${f}`;
function goldV(T,y0,y1){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,T.goldA);gr.addColorStop(.48,T.goldB);gr.addColorStop(.78,T.goldC);gr.addColorStop(1,T.goldB);return gr;}
function goldD(T,x0,y0,x1,y1){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,T.goldC);gr.addColorStop(.3,T.goldA);gr.addColorStop(.55,T.goldB);gr.addColorStop(.8,T.goldA);gr.addColorStop(1,T.goldC);return gr;}
function fadeLine(T,cx,y,w,lw=1.4,a=1){const gr=g.createLinearGradient(cx-w/2,0,cx+w/2,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,T.goldB);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.globalAlpha=a;g.fillStyle=gr;g.fillRect(cx-w/2,y-lw/2,w,lw);g.restore();}
function wrap2(txt,maxW){const w=String(txt).split(/\s+/).filter(Boolean);if(g.measureText(w.join(' ')).width<=maxW||w.length<2)return[w.join(' ')];let best=null;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' '),m=Math.max(g.measureText(a).width,g.measureText(b).width);if(!best||m<best[0])best=[m,[a,b]];}return best[1];}
function wrap(txt,maxW){const w=String(txt).split(/\s+/).filter(Boolean),L=[];let cur='';for(const t of w){const n=cur?cur+' '+t:t;if(g.measureText(n).width>maxW&&cur){L.push(cur);cur=t;}else cur=n;}if(cur)L.push(cur);return L;}
// يقيس أكبر خط يدخل في maxLines سطر
function fitLines(t,w,f,fs0,fsMin,maxW,maxLines){const wr=maxLines===2?wrap2:wrap;for(let fs=fs0;fs>=fsMin;fs-=1){g.font=font(w,fs,f);const L=wr(t,maxW);if(L.length<=maxLines&&L.every(l=>g.measureText(l).width<=maxW))return{fs,L,ok:1};}
  g.font=font(w,fsMin,f);let L=wrap(t,maxW);if(L.length>maxLines)L=[...L.slice(0,maxLines-1),L.slice(maxLines-1).join(' ')];return{fs:fsMin,L};}
function star8(cx,cy,r,k=.42){g.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,rr=i%2?r*k:r;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}g.closePath();}
function diamond(cx,cy,r,rx){rx=rx||r;g.beginPath();g.moveTo(cx,cy-r);g.lineTo(cx+rx,cy);g.lineTo(cx,cy+r);g.lineTo(cx-rx,cy);g.closePath();}
// قوس مدبب (محراب)
function archPath(L,A,R,B,s,k=.1,q=.1){const cx=(L+R)/2,w=R-L;g.moveTo(L,B);g.lineTo(L,A+s);g.bezierCurveTo(L,A+s*.42,cx-w*k,A+s*q,cx,A);g.bezierCurveTo(cx+w*k,A+s*q,R,A+s*.42,R,A+s);g.lineTo(R,B);g.closePath();}
function parch(x,y,w,h){g.beginPath();archPath(x,y,x+w,y+h,w*.56,.06);}
// زخرفة: نجمة مضلعة صغيرة بين خطين
function ornament(T,cx,y,w,sc){fadeLine(T,cx-w*.29,y,w*.42,1.4*sc);fadeLine(T,cx+w*.29,y,w*.42,1.4*sc);
  g.fillStyle=goldD(T,cx-14*sc,y-14*sc,cx+14*sc,y+14*sc);star8(cx,y,13*sc,.5);g.fill();g.fillStyle=T.bg1;star8(cx,y,5*sc,.5);g.fill();
  g.fillStyle=T.goldB;for(const s of[-1,1]){diamond(cx+s*26*sc,y,4*sc);g.fill();diamond(cx+s*38*sc,y,2.6*sc);g.fill();}}
function lattice(c,W,H,st,lw){const r=st*.3;c.lineWidth=lw;c.beginPath();
  for(let y=0;y<=H+st;y+=st)for(let x=0;x<=W+st;x+=st){
    for(const rot of[0,Math.PI/4]){for(let i=0;i<4;i++){const a=rot+i*Math.PI/2-Math.PI/4,b=a+Math.PI/2;const p=[x+Math.cos(a)*r,y+Math.sin(a)*r],q=[x+Math.cos(b)*r,y+Math.sin(b)*r];if(!i)c.moveTo(...p);c.lineTo(...q);}}
    c.moveTo(x+r*1.0,y);c.lineTo(x+st-r,y);c.moveTo(x,y+r);c.lineTo(x,y+st-r);
    const dx=x+st/2,dy=y+st/2,d=st*.13;c.moveTo(dx,dy-d);c.lineTo(dx+d,dy);c.lineTo(dx,dy+d);c.lineTo(dx-d,dy);c.closePath();}
  c.stroke();}

    if(q){const s=118*sc;add(s+44*sc,18,.6,y=>{const n=q.getModuleCount(),c=s/n,qx=cx-s/2,qy=y;g.fillStyle='#fff';g.strokeStyle=T.goldB;g.lineWidth=2;g.beginPath();g.roundRect(qx-9*sc,qy-9*sc,s+18*sc,s+18*sc,10*sc);g.fill();g.stroke();g.fillStyle='#1a1448';
      for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(qx+k*c,qy+r*c,c+.3,c+.3);tx('امسح الباركود للموقع',font(600,17*sc,F.cairo),T.muted,cx,qy+s+30*sc);});}}
  if(on('tail')&&S.close){const r=fitLines(S.close,600,F.mes,29*sc,20*sc,maxW,2),lh=r.fs*1.45;add(r.L.length*lh,26,1.2,y=>r.L.forEach((l,i)=>{const yy=y+lh*i+lh*.5;tx(l,font(600,r.fs,F.mes),T.dark?goldV(T,yy-r.fs*.6,yy+r.fs*.5):T.goldC,cx,yy,maxW);}));}
  return Bk;
}

// المربع: الصور في عمود والنص في عمود عشان تستغل العرض
function layoutBlocks(T,W,sc,Z,pk){const P=S.photos.filter(p=>p.src||p.name);if(!Z.split||!P.length)return blocks(T,W,sc,Z,pk);
  const inner=W-2*110,colW=inner*.4,txW=inner-colW-50*sc,txCx=W/2+inner/2-txW/2,phCx=W/2-inner/2+colW/2,divX=W/2-inner/2+colW+25*sc;
  const head=blocks(T,W,sc,Z,pk,{parts:['head']}),tail=blocks(T,W,sc,Z,pk,{parts:['tail']});
  const n=P.length,rows=n===3?[[1],[0,2]]:[P.map((p,i)=>i)];let u=colW*pk*Math.min(1,sc/.84);
  const dimsF=u=>P.map((p,i)=>n===3?(i===1?[u*.5,u*.63]:[u*.42,u*.53]):n===2?[u*.44,u*.56]:[u*.66,u*.84]),gapF=u=>n===1?0:u*.12;
  let pr=photoRows(T,P,rows,dimsF(u),gapF(u),phCx,sc,Z),txt,tH;
  // النص يكبر لين يملأ ارتفاع عمود الصور
  for(let f=1.4;f>=1;f-=.04){txt=blocks(T,W,sc*f,Z,pk,{parts:['text'],cx:txCx,maxW:txW});if(txt.length)txt[0].gap=0;tH=txt.reduce((a,b)=>a+b.h+b.gap,0);if(tH<=pr.h*1.02)break;}
  for(let it=0;it<4&&tH>pr.h*1.03&&u<colW;it++){u=Math.min(colW,u*Math.min(1.25,tH/pr.h));pr=photoRows(T,P,rows,dimsF(u),gapF(u),phCx,sc,Z);}
  const split={h:Math.max(tH,pr.h),gap:30*sc,flex:2.4,d:y=>{const h=Math.max(tH,pr.h);pr.d(y+(h-pr.h)/2);let yy=y+(h-tH)/2;for(const b of txt){yy+=b.gap;g.save();b.d(yy);g.restore();yy+=b.h;}
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,T.goldB);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(divX-.6,y,1.2,h);g.fillStyle=goldD(T,divX-9,y+h/2-9,divX+9,y+h/2+9);star8(divX,y+h/2,9*sc,.5);g.fill();}};
  return[...head,split,...tail];}

function draw(){const T=THEMES[S.theme]||THEMES.navy,Z=SZ[S.size]||SZ.post,W=Z.W,H=Z.H;cv.width=W;cv.height=H;g.direction='rtl';g.textAlign='center';g.textBaseline='middle';
  const G=geom(Z);CG=G;background(T,W,H,G);frame(T,W,H,G);
  const avail=G.bottom-G.top;let sc=Z.scMax,pk=1,Bk,tot;
  // الصور تصغر أسرع من النص عشان يبقى النص مقروء
  for(;;){Bk=layoutBlocks(T,W,sc,Z,pk);tot=Bk.reduce((a,b)=>a+b.h+b.gap,0);if(tot<=avail||sc<=.45)break;if(pk>Z.pkMin)pk-=.02;sc-=.015;}
  // نوزع المساحة الزايدة على الفواصل (بحد أعلى) والباقي فوق وتحت
  let left=Math.max(0,avail-tot);const FW=Bk.slice(1).reduce((a,b)=>a+b.flex,0)||1,per=Math.min(left/FW,46*sc);
  Bk.forEach((b,i)=>{if(i){b.gap+=b.flex*per;left-=b.flex*per;}});
  let y=G.top+Math.max(0,left)*.42;
  for(const b of Bk){y+=b.gap;g.save();g.textBaseline='middle';g.textAlign='center';b.d(y);g.restore();y+=b.h;}
  // التذييل
  const parts=[S.social,S.site].filter(Boolean);if(parts.length){const fy=G.B-30;g.font=font(600,H>1500?24:21,F.cairo);g.direction='ltr';g.fillStyle=T.muted;
    if(parts.length===2){const a=g.measureText(parts[0]).width,b=g.measureText(parts[1]).width,gp=46,x0=W/2-(a+b+gp)/2;g.textAlign='left';g.fillText(parts[0],x0,fy);g.fillText(parts[1],x0+a+gp,fy);g.fillStyle=T.goldB;diamond(x0+a+gp/2,fy,4);g.fill();}
    else{g.textAlign='center';g.fillText(parts[0],W/2,fy);}g.direction='rtl';g.textAlign='center';}
}

// ===== لوحة التحكم =====
const panel=document.getElementById('panel');
panel.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
  if(el.classList.contains('seg')){const sync=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[k]));sync();
    el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[k]=b.dataset.v;sync();save();draw();});}
  else{el.value=S[k]||'';el.addEventListener('input',()=>{S[k]=el.value;save();draw();});}});
function buildPhotos(){const box=document.getElementById('photos');box.innerHTML='';
  S.photos.forEach((p,i)=>{const d=document.createElement('div');d.className='ph';
    d.innerHTML=`<div class="hd"><span class="th" style="background-image:url('${p.src||''}')"></span><b>الصورة ${['الأولى (يمين)','الثانية (الوسط · أكبر)','الثالثة (يسار)'][i]}</b><span class="x"><label class="up">تغيير<input type="file" accept="image/*"></label><button data-del>حذف</button></span></div>
      <div class="row2"><label class="f">الصفة<input data-p="role"></label><label class="f">الاسم<input data-p="name"></label></div>
      <label class="f">سطر تحت الاسم (اختياري)<input data-p="note" placeholder="مثل: رحمه الله"></label>
      <div class="row3"><label class="f">تكبير<input type="range" min="1" max="2.5" step=".01" data-r="z"></label><label class="f">يمين/يسار<input type="range" min="-1" max="1" step=".01" data-r="x"></label><label class="f">فوق/تحت<input type="range" min="-1" max="1" step=".01" data-r="y"></label></div>`;
    d.querySelectorAll('[data-p]').forEach(el=>{el.value=p[el.dataset.p]||'';el.addEventListener('input',()=>{p[el.dataset.p]=el.value;save();draw();});});
    d.querySelectorAll('[data-r]').forEach(el=>{el.value=p[el.dataset.r]??(el.dataset.r==='z'?1:0);el.addEventListener('input',()=>{p[el.dataset.r]=+el.value;save();draw();});});
    d.querySelector('input[type=file]').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{   // نصغّر الصورة عشان تنحفظ
        const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        p.src=c.toDataURL('image/jpeg',.9);p.z=1;p.x=0;p.y=0;save();buildPhotos();draw();};im.src=r.result;};r.readAsDataURL(f);});
    d.querySelector('[data-del]').addEventListener('click',()=>{p.src='';p.name='';p.role='';p.note='';save();buildPhotos();draw();});
    box.appendChild(d);});
  const h=document.createElement('p');h.className='hint';h.textContent='اترك الصورة والاسم فاضيين عشان تنشال من الدعوة. إذا كانت ٣ صور، الوسطى تطلع أكبر (مناسبة للعريس). ارفع أي صورة وعدّل مكانها بالأزرار.';box.appendChild(h);}
buildPhotos();
document.getElementById('cv').addEventListener('click',()=>{if(matchMedia('(max-width:980px)').matches)document.getElementById('stage').classList.toggle('big');});

const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);};
const fname=()=>'دعوة-'+(S.groom||'الأسرة').split(' ')[0]+'.png';
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='reset'){if(!confirm('ترجع كل شي للنموذج الأصلي؟'))return;S=structuredClone(DEF);S.v2=1;save();location.reload();return;}
  draw();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(a==='share'&&navigator.canShare){const f=new File([blob],fname(),{type:'image/png'});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'دعوة'});}catch(e){}return;}}
  const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=fname();document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('تم تحميل الدعوة');});

const AR='بسم الله عبدالعزيز ٢٣';
Promise.all([['400 40px "Scheherazade New"','﷽'],['700 40px "Aref Ruqaa"',AR],['700 30px "El Messiri"',AR],['600 30px "El Messiri"',AR],['600 30px Cairo',AR],['700 30px Cairo',AR],['500 30px Cairo',AR]].map(([f,t])=>document.fonts.load(f,t).catch(()=>{}))).then(()=>document.fonts.ready).then(draw);draw();
