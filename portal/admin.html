<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم | أسرة العجلان والعيد</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021830">
<link rel="stylesheet" href="home.css?v=202611040130">
<link rel="stylesheet" href="admin.css?v=202611050200">
</head>
<body class="far adminp">
<div id="scene" aria-hidden="true"></div><div class="towerfg" aria-hidden="true"></div>
<div class="atree" aria-hidden="true"><img id="treeImg" src="img/tree-cut.webp" srcset="img/tree-cut-sm.webp 895w, img/tree-cut.webp 1790w" sizes="400px" alt=""><img class="soil" src="img/soil.webp?v=2" alt=""><canvas id="rockets"></canvas></div>

<main class="astage" id="login">
  <form class="acard" id="form" autocomplete="on">
    <img class="alogo" src="img/logo-full.png" alt="أسرة العجلان والعيد">
    <h1>لوحة التحكم</h1>
    <label>اسم المستخدم<input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required></label>
    <label>كلمة المرور<span class="apw"><input id="pass" name="password" type="password" autocomplete="current-password" dir="ltr" required><button type="button" id="eye" aria-label="إظهار كلمة المرور">إظهار</button></span></label>
    <p class="aerr" id="err" role="alert" hidden></p>
    <button class="ago" id="go" type="submit">تسجيل الدخول</button>
    <a class="aback" href="index.html">الرجوع للموقع</a>
  </form>
</main>

<main class="adash" id="dash" hidden>
  <header class="ahead">
    <img src="img/logo-mark.png" alt="">
    <div><small>أسرة العجلان والعيد</small><h1>لوحة التحكم</h1></div>
    <button id="out" type="button">تسجيل الخروج</button>
  </header>
  <section class="astats" id="stats" aria-label="أرقام الموقع"></section>
  <h2>الوصول السريع</h2>
  <nav class="alinks" id="links" aria-label="الوصول السريع"></nav>
  <h2>آخر ما نُشر</h2>
  <div class="alist" id="latest"></div>
</main>

<script src="common.js?v=202611022230"></script>
<script src="rockets.js?v=202611031900"></script>
<script>
(() => {
  // الدخول يتحقق في المتصفح لأن الموقع ثابت بدون خادم، فلا تُحفظ هنا أي بيانات سرية
  const AUTH = {user: 'fahad', salt: 'S9IQbdpIDSmmIXEIQTu4Qg==', iter: 200000, hash: 'q6jUDtOz1YxlZesfxh403ua3Z/0NEV46f+Uis0mo8EQ='};
  const KEY = 'ajlan-admin';
  const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {get: () => {try {return sessionStorage.getItem(KEY);} catch {return null;}}, set: v => {try {v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY);} catch {}}};

  const derive = async (u, p) => {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(`${u}:${p}`), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: unb64(AUTH.salt), iterations: AUTH.iter}, k, 256));
  };

  const LINKS = [
    ['مصمم الدعوات', 'invite.html', 'mail'], ['الأخبار والمناسبات', 'news.html', 'news'], ['مجلات التغطيات', 'coverages.html', 'film'],
    ['مكتبة المجلات', 'magazines.html', 'mag'], ['شجرة العائلة', TREE_URL, 'tree'], ['الصفحة الرئيسية', 'index.html', 'home'],
  ];

  async function openDash() {
    $('#login').hidden = true; $('#dash').hidden = false; document.body.classList.add('indash');
    $('#links').innerHTML = LINKS.map(([t, u, i]) => `<a href="${u}">${svg(i, 22)}<span>${t}</span></a>`).join('');
    const [site, posts, idx] = await Promise.all([loadJSON('data/site.json'), loadJSON('data/posts.json'), loadJSON('data/albums/index.json')]);
    const cats = c => posts.filter(p => p.c === c).length;
    $('#stats').innerHTML = [['كل المنشورات', posts.length], ['الأخبار', cats('أخبار الاسرة')], ['الدعوات', cats('دعوات الأسرة')], ['مجلات التغطيات', Object.keys(idx.a).length], ['أعداد المجلة', site.magazines.length]]
      .map(([t, n]) => `<div><b>${ar(n)}</b><span>${t}</span></div>`).join('');
    $('#latest').innerHTML = posts.slice(0, 6).map(p => `<a href="post.html?id=${p.id}"><time>${fmtDate(p.d)}</time><b>${esc(p.t)}</b><em>${esc(catName(p.c))}</em></a>`).join('');
  }

  $('#eye').onclick = e => {const i = $('#pass'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.target.textContent = s ? 'إخفاء' : 'إظهار';};
  $('#form').onsubmit = async e => {
    e.preventDefault();
    const go = $('#go'), err = $('#err'), u = $('#user').value.trim();
    go.disabled = true; go.textContent = 'جارٍ التحقق…'; err.hidden = true;
    const h = await derive(u, $('#pass').value);
    if (u === AUTH.user && h === AUTH.hash) {store.set(h); $('#pass').value = ''; openDash();}
    else {err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; err.hidden = false; $('#pass').value = ''; $('#pass').focus();}
    go.disabled = false; go.textContent = 'تسجيل الدخول';
  };
  $('#out').onclick = () => {store.set(null); location.reload();};
  if (store.get() === AUTH.hash) openDash();
  startRockets();
})();
</script>
</body>
</html>
