<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم | أسرة العجلان والعيد</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021830">
<link rel="stylesheet" href="home.css?v=202611040130">
<link rel="stylesheet" href="admin.css?v=202611051800">
<link rel="stylesheet" href="admin-editor.css?v=202611051800">
<link rel="stylesheet" href="admin-panel.css?v=202611051800">
</head>
<body class="far adminp">
<div id="scene" aria-hidden="true"></div><div class="towerfg" aria-hidden="true"></div>
<div class="atree" aria-hidden="true"><img id="treeImg" src="img/tree-cut.webp" srcset="img/tree-cut-sm.webp 895w, img/tree-cut.webp 1790w" sizes="400px" alt=""><img class="soil" src="img/soil.webp?v=2" alt=""><canvas id="rockets"></canvas></div>

<main class="astage" id="login">
  <form class="acard" id="form" autocomplete="on">
    <img class="alogo" src="img/logo-full.png" alt="أسرة العجلان والعيد">
    <h1>لوحة التحكم</h1>
    <label>اسم المستخدم<input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required></label>
    <label>كلمة المرور<span class="apw"><input id="pass" name="password" type="password" autocomplete="current-password" dir="ltr" required><button type="button" id="eye" aria-label="إظهار كلمة المرور">إظهار</button></span></label>
    <p class="aerr" id="err" role="alert" hidden></p>
    <button class="ago" id="go" type="submit">تسجيل الدخول</button>
    <a class="aback" href="index.html">الرجوع للموقع</a>
  </form>
</main>

<div class="shell" id="dash" hidden>
  <header class="mtop"><button id="burger" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="side"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b id="mtitle">الرئيسية</b><img src="img/logo-mark.png" alt=""></header>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side">
    <div class="sbrand"><img src="img/logo-mark.png" alt=""><div><small>أسرة العجلان والعيد</small><b>لوحة التحكم</b></div></div>
    <nav id="snav" aria-label="أقسام اللوحة"></nav>
    <div class="sfoot"><a href="index.html" target="_blank" rel="noopener">عرض الموقع</a><button id="out" type="button">تسجيل الخروج</button></div>
  </aside>
  <section class="work">
    <p class="demotag" id="demoTag" hidden>نسخة عرض: التعديلات لا تُنشر للناس حتى ننقل الموقع للدومين</p>
    <main id="view"></main>
  </section>
</div>

<script src="common.js?v=202611051800"></script>
<script src="rockets.js?v=202611031900"></script>
<script src="admin-store.js?v=202611051800"></script>
<script src="admin-photos.js?v=202611051800"></script>
<script src="admin-editor.js?v=202611051800"></script>
<script src="admin-sections.js?v=202611051800"></script>
<script>
(() => {
  // بصمة كلمة مرور نسخة العرض فقط. على الخادم الدخول يتحقق في الخادم ولا تُستخدم هذه البصمة
  const AUTH = {user: 'fahad', salt: 'S9IQbdpIDSmmIXEIQTu4Qg==', iter: 200000, hash: 'q6jUDtOz1YxlZesfxh403ua3Z/0NEV46f+Uis0mo8EQ='};
  const ready = Store.init(AUTH), S = Editor.S, err = t => {$('#err').textContent = t; $('#err').hidden = false;};

  async function openDash() {
    $('#login').hidden = true; $('#dash').hidden = false; document.body.classList.add('indash');
    [S.site, S.posts, S.idx] = await Promise.all(['data/site.json', 'data/posts.json', 'data/albums/index.json'].map(async p => (await Store.snapshot()).json(p)));
    Editor.start(Panel.build());
  }
  $('#eye').onclick = e => {const i = $('#pass'), s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.target.textContent = s ? 'إخفاء' : 'إظهار';};
  $('#form').onsubmit = async e => {
    e.preventDefault();
    const go = $('#go'), u = $('#user').value.trim();
    go.disabled = true; go.textContent = 'جارٍ التحقق…'; $('#err').hidden = true;
    await ready;
    try {
      if (Store.mode === 'down') err('الخادم لا يجيب الآن. حاول بعد قليل.');
      else if (!Store.configured) err('الموقع لم يُجهَّز بعد. افتح صفحة الإعداد api/setup.php أولاً.');
      else if (await Store.login(u, $('#pass').value)) {$('#pass').value = ''; go.disabled = false; go.textContent = 'تسجيل الدخول'; return openDash();}
      else {err('اسم المستخدم أو كلمة المرور غير صحيحة'); $('#pass').value = ''; $('#pass').focus();}
    } catch (x) {err(x.note || 'تعذّر الدخول الآن. حاول بعد قليل.');}
    go.disabled = false; go.textContent = 'تسجيل الدخول';
  };
  $('#out').onclick = async () => {await Store.logout(); location.hash = ''; location.reload();};
  startRockets();
  ready.then(async () => {if (Store.mode !== 'down' && Store.configured && await Store.resume()) openDash();});
})();
</script>
</body>
</html>
