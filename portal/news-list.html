<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأخبار والمناسبات | أسرة العجلان والعيد</title>
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021830">
<link rel="stylesheet" href="home.css?v=202611021830">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="news.css?v=202611031800">
</head>
<body class="scened newsmag">
<div id="scene" aria-hidden="true"></div>
<div class="page-top">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">الرئيسية</a> ‹ الأخبار والمناسبات</div>
    <div class="nm-mast"><span class="nm-kick">أرشيف أسرة العجلان والعيد</span>
      <h1>الأخبار والمناسبات</h1>
      <div class="nm-rule"><i></i><b></b><i></i></div>
      <p id="sum">كل أخبار الأسرة ودعواتها ومناسباتها</p></div>
  </div>
</div>
<section style="padding-top:40px">
  <div class="wrap">
    <div class="toolbar">
      <div class="tabs" id="tabs" style="margin:0"></div>
      <label class="search"><span style="color:var(--gold-d)" id="sic"></span><input id="q" type="search" placeholder="ابحث في الأخبار… (اسم، مناسبة، سنة)"></label>
    </div>
    <div class="nm-bar"><div class="count" id="count"></div><a class="nm-vol" id="volLink" href="volume.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>عرض كمجلد «سجل الأسرة»</a></div>
    <a class="magslink" id="magsLink" href="coverages.html" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>تصفّح التغطيات كمجلات مصوّرة</a>
    <div class="nm-grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </div>
</section>
<script src="common.js?v=202611031600"></script>
<script src="rockets.js?v=202611021830"></script>
<script>
(async () => {
  const [site, posts, aidx] = await Promise.all([loadJSON('data/site.json'), loadJSON('data/posts.json'), fetch('data/albums/index.json?v=202611040000').then(r => r.json()).catch(() => ({a: {}}))]);
  const albums = aidx.a || {};
  $('#grid').addEventListener('click', e => {const c = e.target.closest('[data-album]'); if (c) {e.preventDefault(); location.href = `album.html?id=${c.dataset.album}`;}});
  buildChrome(site);
  $('#sic').innerHTML = svg('search', 20);
  const cats = ['', 'أخبار الاسرة', 'دعوات الأسرة', 'مناسبات الاسرة'];
  const counts = c => posts.filter(p => !c || p.c === c).length;
  const P = new URLSearchParams(location.search);
  let cat = P.get('c') || '', q = P.get('q') || '', yr = P.get('y') || '', page = +(P.get('p') || 1);
  const PER = 24;
  $('#q').value = q;
  $('#sum').textContent = `${ar(posts.length)} خبراً ودعوة ومناسبة من أخبار الأسرة`;
  const norm = s => s.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, '');
  // ===== تخطيط المجلة: خبر رئيسي ثم صفوف متنوّعة تمتلئ دائماً =====
  const BOOK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>';
  const card = (p, kind) => {
    const A = albums[p.id], poster = p.c === 'دعوات الأسرة' || /phonto/i.test(p.i || '');
    const [y, m, d] = p.d.split('-').map(Number);
    return `<a class="nm-c nm-${kind} rv" href="post.html?id=${p.id}">
      <figure class="nm-ph"${poster ? ' data-poster="1"' : ''}>${p.i ? `<img src="${esc(p.i)}" alt="" loading="${kind === 'lead' ? 'eager' : 'lazy'}" decoding="async">` : '<i class="nm-noimg"></i>'}</figure>
      <div class="nm-tx">
        <div class="nm-kick"><span>${esc(catName(p.c))}</span><i></i></div>
        <h3>${esc(p.t)}</h3>
        ${kind === 'q' ? '' : `<p>${esc((p.x || '').replace(/^\s*السلام عليكم ورحمة الله وبركاته\s*/, ''))}</p>`}
        <div class="nm-meta"><time><b>${ar(d)}</b> ${MONTHS[m - 1]} ${ar(y)}</time>${A ? `<span class="nm-mag" data-album="${p.id}" role="link" title="تصفّح الصور كمجلة">${BOOK}مجلة مصوّرة</span>` : ''}${kind === 'lead' ? '<span class="nm-more">اقرأ الخبر ‹</span>' : ''}</div>
      </div></a>`;
  };
  const ROWS = [['t', 3], ['w', 2], ['q', 4]];
  function magLayout(items) {
    if (!items.length) return '';
    let h = '', i = 0, r = 0;
    while (i < items.length) {
      const left = items.length - i;
      let [k, n] = ROWS[r++ % ROWS.length];
      if (n > left) [k, n] = left >= 3 ? ['t', 3] : left === 2 ? ['w', 2] : ['w1', 1];
      h += `<div class="nm-row nm-r${k}">${items.slice(i, i + n).map(p => card(p, k)).join('')}</div>`; i += n;
    }
    return h;
  }
  function render(push) {
    $('#tabs').innerHTML = cats.map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c ? catName(c) : 'الكل'} <small style="opacity:.7">${ar(counts(c))}</small></button>`).join('');
    const nq = norm(q.trim());
    const L = posts.filter(p => (!cat || p.c === cat) && (!yr || p.d.startsWith(yr)) && (!nq || norm(p.t + ' ' + p.x + ' ' + p.d).includes(nq)));
    const pages = Math.max(1, Math.ceil(L.length / PER));
    page = Math.min(Math.max(1, page), pages);
    $('#count').innerHTML = (yr ? `أخبار عام ${ar(+yr)} · <a href="news.html" style="color:var(--gold-d);font-weight:700">كل السنوات</a> · ` : '') + (L.length ? `${ar(L.length)} نتيجة · صفحة ${ar(page)} من ${ar(pages)}` : 'لا توجد نتائج');
    $('#grid').innerHTML = magLayout(L.slice((page - 1) * PER, page * PER));
    // الصور: قص آمن للوجوه (من الأعلى)، والملصقات والصور الطولية كاملة على ورقة
    $('#grid').querySelectorAll('.nm-ph img').forEach(im => {const fit = () => {const a = im.naturalWidth / im.naturalHeight, f = im.closest('.nm-ph');
      if (f.dataset.poster || a < .9 || a > 1.65) f.classList.add('fit'); im.classList.add('in');};
      im.complete && im.naturalWidth ? fit() : im.addEventListener('load', fit, {once: true});});
    $('#magsLink').hidden = cat !== 'مناسبات الاسرة';
    const btn = (n, t = ar(n), dis = false) => `<button data-p="${n}" class="${n === page ? 'on' : ''}" ${dis ? 'disabled' : ''}>${t}</button>`;
    let pg = btn(page - 1, '‹ السابق', page === 1);
    for (let n = 1; n <= pages; n++) if (n === 1 || n === pages || Math.abs(n - page) <= 2) pg += btn(n); else if (Math.abs(n - page) === 3) pg += '<span style="align-self:center">…</span>';
    pg += btn(page + 1, 'التالي ›', page === pages);
    $('#pager').innerHTML = pages > 1 ? pg : '';
    const u = new URLSearchParams(); if (cat) u.set('c', cat); if (yr) u.set('y', yr); if (q) u.set('q', q); if (page > 1) u.set('p', page);
    history[push ? 'pushState' : 'replaceState'](null, '', '?' + u);
    $("#volLink").href = "volume.html" + (String(u) ? '?' + u : '');
    reveal();
  }
  $('#tabs').addEventListener('click', e => {const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; page = 1; render(true);});
  $('#pager').addEventListener('click', e => {const b = e.target.closest('button'); if (!b || b.disabled) return; page = +b.dataset.p; render(true); scrollTo({top: 0, behavior: 'smooth'});});
  let t; $('#q').addEventListener('input', e => {clearTimeout(t); t = setTimeout(() => {q = e.target.value; page = 1; render(false);}, 200);});
  addEventListener('popstate', () => {const P = new URLSearchParams(location.search); cat = P.get('c') || ''; q = P.get('q') || ''; page = +(P.get('p') || 1); $('#q').value = q; render(false);});
  render(false);
})();
</script>
</body>
</html>
