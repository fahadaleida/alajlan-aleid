<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0E0B26">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body class="reader">
<div id="scene" aria-hidden="true"></div>
<div class="amb" aria-hidden="true"></div>

<header class="rbar">
  <a class="rback" href="magazines.html" aria-label="العودة إلى مكتبة المجلات">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span>المكتبة</span></a>
  <a class="rbrand" href="index.html" aria-label="الرئيسية"><img src="img/logo-mark.png" alt=""></a>
  <div class="rtitle"><b id="rt">مجلة الأسرة</b><small id="rs"></small></div>
  <div class="ract">
    <label class="rissue" title="اختر العدد"><span class="sr">اختر العدد</span><select id="issue"></select></label>
    <button class="ib" id="bThumbs" title="الصفحات" aria-label="عرض الصفحات" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <button class="ib" id="bZoom" title="تكبير" aria-label="تكبير الصفحة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
    <button class="ib" id="bFull" title="ملء الشاشة" aria-label="ملء الشاشة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <a class="ib dl" id="bDl" href="#" target="_blank" rel="noopener" title="تحميل نسخة PDF" aria-label="تحميل نسخة PDF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>PDF</span></a>
  </div>
</header>

<main class="stage" id="stage">
  <button class="arr prev" id="bPrev" aria-label="الصفحة السابقة"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="bookzone" id="zone">
    <div class="glow" aria-hidden="true"></div>
    <div class="shift" id="shift"><div id="book" class="book"></div><div class="floor" aria-hidden="true"></div></div>
  </div>
  <button class="arr next" id="bNext" aria-label="الصفحة التالية"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="intro" id="intro"><div class="spin"></div><span>جارٍ فتح المجلة…</span></div>
</main>

<footer class="rfoot">
  <div class="thumbs" id="thumbs" aria-label="صفحات العدد"></div>
  <div class="ctrl">
    <span class="cnt" id="cnt">—</span>
    <input type="range" id="prog" min="1" max="2" value="1" dir="rtl" aria-label="الانتقال إلى صفحة">
    <span class="hint" id="hint">اسحب طرف الصفحة أو استخدم الأسهم</span>
  </div>
</footer>

<div class="zoom" id="zoom" hidden>
  <div class="zbar"><span id="zcap"></span>
    <div><button class="ib" id="zOut" aria-label="تصغير"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button class="ib" id="zIn" aria-label="تكبير"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="zClose" aria-label="إغلاق التكبير"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <div class="zpan" id="zpan"><div class="zin" id="zin"></div></div>
</div>

<div class="miss" id="miss" hidden><p>هذا العدد غير متوفر للقراءة حالياً.</p><a class="rback" href="magazines.html">العودة إلى المكتبة</a></div>
