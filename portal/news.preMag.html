<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأخبار والمناسبات | أسرة العجلان والعيد</title>
<meta name="theme-color" content="#1A1448">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611021830">
<link rel="stylesheet" href="home.css?v=202611021830">
<style>
.ncard .im{position:relative}
.magchip{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;color:#322781;
  background:rgba(255,253,248,.94);border:1px solid rgba(227,182,107,.9);box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer;transition:transform .2s,background .2s}
.magchip svg{color:#C08537}.magchip:hover{transform:translateY(-2px);background:#fff}
.magslink{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 18px;border-radius:99px;font-weight:800;font-size:14.5px;color:#fff;background:#322781;box-shadow:0 8px 20px rgba(50,39,129,.3)}
.magslink svg{color:#E3B66B}.magslink[hidden]{display:none}
</style>
</head>
<body class="scened">
<div id="scene" aria-hidden="true"></div>
<div class="page-top">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">الرئيسية</a> ‹ الأخبار والمناسبات</div>
    <h1>الأخبار والمناسبات</h1>
    <p id="sum">كل أخبار الأسرة ودعواتها ومناسباتها</p>
  </div>
</div>
<section style="padding-top:40px">
  <div class="wrap">
    <div class="toolbar">
      <div class="tabs" id="tabs" style="margin:0"></div>
      <label class="search"><span style="color:var(--gold-d)" id="sic"></span><input id="q" type="search" placeholder="ابحث في الأخبار… (اسم، مناسبة، سنة)"></label>
    </div>
    <div class="count" id="count"></div>
    <a class="magslink" id="magsLink" href="coverages.html" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>تصفّح التغطيات كمجلات مصوّرة</a>
    <div class="news-grid" id="grid" style="margin-top:14px"></div>
    <div class="pager" id="pager"></div>
  </div>
</section>
<script src="common.js?v=202611021830"></script>
<script src="rockets.js?v=202611021830"></script>
<script>
(async () => {
  const [site, posts, aidx] = await Promise.all([loadJSON('data/site.json'), loadJSON('data/posts.json'), fetch('data/albums/index.json?v=202611022230').then(r => r.json()).catch(() => ({a: {}}))]);
  const albums = aidx.a || {};
  $('#grid').addEventListener('click', e => {const c = e.target.closest('[data-album]'); if (c) {e.preventDefault(); location.href = `album.html?id=${c.dataset.album}`;}});
  buildChrome(site);
  $('#sic').innerHTML = svg('search', 20);
  const cats = ['', 'أخبار الاسرة', 'دعوات الأسرة', 'مناسبات الاسرة'];
  const counts = c => posts.filter(p => !c || p.c === c).length;
  const P = new URLSearchParams(location.search);
  let cat = P.get('c') || '', q = P.get('q') || '', yr = P.get('y') || '', page = +(P.get('p') || 1);
  const PER = 24;
  $('#q').value = q;
  $('#sum').textContent = `${ar(posts.length)} خبراً ودعوة ومناسبة من أخبار الأسرة`;
  const norm = s => s.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, '');
  function render(push) {
    $('#tabs').innerHTML = cats.map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c ? catName(c) : 'الكل'} <small style="opacity:.7">${ar(counts(c))}</small></button>`).join('');
    const nq = norm(q.trim());
    const L = posts.filter(p => (!cat || p.c === cat) && (!yr || p.d.startsWith(yr)) && (!nq || norm(p.t + ' ' + p.x + ' ' + p.d).includes(nq)));
    const pages = Math.max(1, Math.ceil(L.length / PER));
    page = Math.min(Math.max(1, page), pages);
    $('#count').innerHTML = (yr ? `أخبار عام ${ar(+yr)} · <a href="news.html" style="color:var(--gold-d);font-weight:700">كل السنوات</a> · ` : '') + (L.length ? `${ar(L.length)} نتيجة · صفحة ${ar(page)} من ${ar(pages)}` : 'لا توجد نتائج');
    $('#grid').innerHTML = L.slice((page - 1) * PER, page * PER).map(newsCard).join('');
    // مجلة التغطية: شارة صغيرة على بطاقات المناسبات التي فيها ألبوم
    $('#grid').querySelectorAll('.ncard').forEach(a => {const id = +(a.getAttribute('href').match(/id=(\d+)/) || [])[1];
      if (albums[id]) a.querySelector('.im').insertAdjacentHTML('beforeend', `<span class="magchip" data-album="${id}" role="link" title="تصفّح الصور كمجلة"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>مجلة · ${ar(albums[id][2])} صورة</span>`);});
    $('#magsLink').hidden = cat !== 'مناسبات الاسرة';
    const btn = (n, t = ar(n), dis = false) => `<button data-p="${n}" class="${n === page ? 'on' : ''}" ${dis ? 'disabled' : ''}>${t}</button>`;
    let pg = btn(page - 1, '‹ السابق', page === 1);
    for (let n = 1; n <= pages; n++) if (n === 1 || n === pages || Math.abs(n - page) <= 2) pg += btn(n); else if (Math.abs(n - page) === 3) pg += '<span style="align-self:center">…</span>';
    pg += btn(page + 1, 'التالي ›', page === pages);
    $('#pager').innerHTML = pages > 1 ? pg : '';
    const u = new URLSearchParams(); if (cat) u.set('c', cat); if (yr) u.set('y', yr); if (q) u.set('q', q); if (page > 1) u.set('p', page);
    history[push ? 'pushState' : 'replaceState'](null, '', '?' + u);
    reveal();
  }
  $('#tabs').addEventListener('click', e => {const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; page = 1; render(true);});
  $('#pager').addEventListener('click', e => {const b = e.target.closest('button'); if (!b || b.disabled) return; page = +b.dataset.p; render(true); scrollTo({top: 0, behavior: 'smooth'});});
  let t; $('#q').addEventListener('input', e => {clearTimeout(t); t = setTimeout(() => {q = e.target.value; page = 1; render(false);}, 200);});
  addEventListener('popstate', () => {const P = new URLSearchParams(location.search); cat = P.get('c') || ''; q = P.get('q') || ''; page = +(P.get('p') || 1); $('#q').value = q; render(false);});
  render(false);
})();
</script>
</body>
</html>
